---
name: Monitoring CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Validate YAML files
        run: |
          yamllint .

      - name: Create dummy .env for config validation
        run: |
          echo "GRAFANA_USER=dummy" > .env
          echo "GRAFANA_PASSWORD=dummy" >> .env

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Validate Prometheus config
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/prometheus.yml:/prometheus.yml \
          --entrypoint promtool \
          prom/prometheus:v3.12.0 \
          check config /prometheus.yml

      - name: Validate Grafana provisioning files
        run: |
          python3 << 'EOF'
          import yaml, sys, os

          errors = []

          ds_path = "grafana/provisioning/datasources/datasource.yml"
          if not os.path.exists(ds_path):
              errors.append(f"Missing: {ds_path}")
          else:
              with open(ds_path) as f:
                  try:
                      ds = yaml.safe_load(f)
                      if not ds:
                          errors.append("Empty datasource file")
                      elif "datasources" not in ds:
                          errors.append("Missing 'datasources' key")
                      else:
                          for i, d in enumerate(ds["datasources"]):
                              for key in ("name", "type", "url"):
                                  if key not in d:
                                      errors.append(f"datasource[{i}]: missing '{key}'")
                  except yaml.YAMLError as e:
                      errors.append(f"YAML parse error in {ds_path}: {e}")

          db_path = "grafana/provisioning/dashboards/dashboard.yml"
          if not os.path.exists(db_path):
              errors.append(f"Missing: {db_path}")
          else:
              with open(db_path) as f:
                  try:
                      db = yaml.safe_load(f)
                      if not db:
                          errors.append("Empty dashboard file")
                      elif "providers" not in db:
                          errors.append("Missing 'providers' key")
                      else:
                          for i, p in enumerate(db["providers"]):
                              for key in ("name", "type", "options"):
                                  if key not in p:
                                      errors.append(f"provider[{i}]: missing '{key}'")
                  except yaml.YAMLError as e:
                      errors.append(f"YAML parse error in {db_path}: {e}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("All Grafana provisioning files are valid")
          EOF

  test-stack:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          echo "GRAFANA_USER=${{ secrets.GRAFANA_USER }}" >> .env
          echo "GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}" >> .env

      - name: Start monitoring stack
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Grafana..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3000/api/health; then
              echo "Grafana is up"
              exit 0
            fi
            echo "Attempt $i/12, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Grafana did not start in time"
          exit 1

      - name: Wait for Prometheus to be healthy
        run: |
          for i in $(seq 1 12); do
            if docker exec grafana wget -qO- http://prometheus:9090/-/healthy &>/dev/null; then
              echo "Prometheus is up"
              exit 0
            fi
            echo "Attempt $i/12, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Prometheus did not start in time"
          docker compose logs prometheus
          exit 1

      - name: Check Prometheus is reachable from Grafana container
        run: |
          docker exec grafana wget -qO- http://prometheus:9090/-/healthy

      - name: Wait for Node Exporter metrics to be scraped
        run: |
          for i in $(seq 1 12); do
            if docker exec grafana wget -qO- \
              "http://prometheus:9090/api/v1/query?query=up{job=\"node_exporter\"}" \
              | grep -q '"value"'; then
              echo "Metrics are being scraped"
              exit 0
            fi
            echo "Attempt $i/12, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Node Exporter metrics not found"
          docker compose logs prometheus
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
